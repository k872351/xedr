name: Backend and console quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 按需测试与 CHANGELOG 门禁需要 base..HEAD 的完整 diff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent_admin/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: agent_admin
      # 按需测试：先自检映射选择器（硬门禁），再打印本次变更命中的模块/tier。
      # 打印为信息性步骤，不改变现有全量门禁；浅克隆下取不到 diff 也不得让构建失败。
      - name: Validate on-demand test mapping
        run: python scripts/detect_changes.py --self-test
        shell: pwsh
      - name: On-demand test plan (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          git diff --name-only $base HEAD 2>$null | python scripts/detect_changes.py --stdin --json
      # CHANGELOG 强制门禁：仅 PR 生效；无 diff（push/dispatch）自动通过，避免误伤
      - name: CHANGELOG enforcement
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $files = git diff --name-only $base HEAD 2>$null
          $cliArgs = @('scripts/check_changelog.py','--stdin','--labels',"$env:PR_LABELS")
          if ($env:PR_DRAFT -eq 'true') { $cliArgs += '--draft' }
          $files | python @cliArgs
      # Wave-3: 不再默认 SkipAgent；含策略验签/升级签名/命令调度等全量 Go 测试
      - run: ./scripts/check-edr.ps1 -FullAgentTests
        shell: pwsh
      # 规则回放：样本走真实 matcher，断言命中规则/严重度，防规则变更回归
      - run: python tests/rule_replay/run_replay.py
        shell: pwsh

  agent-matrix-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Cross-compile agent matrix
        shell: pwsh
        run: ./scripts/build_agent_matrix.ps1
